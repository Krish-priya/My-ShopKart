[build]
  command = "npm install --prefix client && npm run build --prefix client"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"

# Do NOT send /api/* to the React app (that broke product loading)
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404
  force = true

# React Router SPA fallback for real pages only
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
