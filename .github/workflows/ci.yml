name: Server CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shopkart
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure env
        run: |
          cat > .env << EOF
          PORT=5000
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_USER=root
          DB_PASSWORD=root
          DB_NAME=shopkart
          JWT_SECRET=ci_test_secret_shopkart
          RAZORPAY_KEY_ID=rzp_test_ci
          RAZORPAY_KEY_SECRET=ci_secret
          EOF

      - name: Setup schema and seed
        run: |
          npm run db:setup
          npm run db:migrate:payments

      - name: Run API tests
        run: npm test
